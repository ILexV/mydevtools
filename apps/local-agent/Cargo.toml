[workspace]
members = ["."]
resolver = "2"

[package]
name = "mydevtools-local-agent"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Local capability-separated companion for MyDevTools"
license = "MIT"
publish = false

[dependencies]
axum = { version = "=0.8.4", features = ["http1", "http2", "json", "tokio"] }
base64 = "=0.22.1"
bytes = "=1.10.1"
chrono = { version = "=0.4.41", default-features = false, features = ["clock", "std"] }
clap = { version = "=4.5.41", features = ["derive"] }
constant_time_eq = "=0.3.1"
futures-util = "=0.3.31"
hex = "=0.4.3"
parking_lot = "=0.12.4"
rand = "=0.8.5"
reqwest = { version = "=0.12.22", default-features = false, features = ["http2", "rustls-tls-webpki-roots", "stream"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.141"
sha2 = "=0.10.9"
tokio = { version = "=1.47.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "=0.7.15", features = ["rt"] }
url = "=2.5.4"
webpki-roots = "=1.0.9"
libc = "=0.2.191"
uuid = { version = "=1.17.0", features = ["serde", "v4"] }

[build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_Dns",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
