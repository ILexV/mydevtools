[package]
name = "mydevtools_compression"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
crc32fast = "1.5"
# `disable-timer` keeps std::time::Instant out of the encoder; it panics on wasm32-unknown-unknown.
brotli = { version = "9", default-features = false, features = ["std", "disable-timer"] }
zstd = { version = "0.13", default-features = false }

[features]
default = []
