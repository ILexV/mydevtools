[package]
name = "mydevtools_cryptography"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
ed25519-dalek = { version = "2.1", features = ["pkcs8"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
signature = "2"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
aead = "0.5"
argon2 = "0.5"
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand_core = "0.6"
rsa = { version = "0.9", features = ["sha2"] }
aes = "0.8"
ctr = "0.9"
bcrypt-pbkdf = "0.10"
num-bigint-dig = "0.8"
pkcs8 = { version = "0.10", features = ["pem", "encryption"] }
rcgen = "0.13"
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
x509-parser = { version = "0.16" }
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
wasm-test = []
