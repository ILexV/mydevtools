[package]
name = "mydevtools_hash"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
digest = "0.10"
sha3 = "0.10"
blake3 = "1"
blake2 = "0.10"
ripemd = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh32", "xxh64"] }
seahash = "4"
fnv = "1"
rustc-hash = "1.1"
metrohash = "1"
highway = "1"
siphasher = "1"
crc32fast = "1"
adler = "1"

[features]
default = []

[dev-dependencies]
# keep tests native (cargo test)
