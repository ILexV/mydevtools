[package]
name = "image_tools"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
# default-features = false keeps the module small; enable exactly the formats
# the image-converter target list offers (png/jpeg/webp/gif/bmp/ico/tiff/tga).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico", "tiff", "tga"] }
color_quant = "1.1"
png = "0.17"
