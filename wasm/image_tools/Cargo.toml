[package]
name = "image_tools"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
# using default-features = false to control size, but enabling most common web formats
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
